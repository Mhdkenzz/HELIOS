[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "helios"
version = "0.2.0"
description = "Lightweight watchdog + replay tool for AI coding agents"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "psutil>=5.9",
    "pydantic>=2.5",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
helios = "helios.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["helios*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"