[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helios"
version = "0.2.0"
description = "Lightweight watchdog + replay tool for AI coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Kenz", email = "kenz@example.com" }
]
keywords = ["watchdog", "replay", "ai", "agent", "devtools", "terminal-recording"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "psutil>=5.9",
    "pydantic>=2.5",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]
windows-pty = [
    "pywinpty>=2.0",
]

[project.scripts]
helios = "helios.cli:app"

[project.urls]
Homepage    = "https://github.com/Mhdkenzz/HELIOS"
Repository  = "https://github.com/Mhdkenzz/HELIOS.git"
Issues      = "https://github.com/Mhdkenzz/HELIOS/issues"
Documentation = "https://github.com/Mhdkenzz/HELIOS#helios"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["helios*"]

[tool.setuptools.package-data]
helios = ["web/*", "web/assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true