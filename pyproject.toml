[project]
name = "helios"
version = "0.1.0"
description = "Lightweight watchdog + replay tool for AI coding agents"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "psutil>=5.9",
    "pydantic>=2.5",
    "watchdog>=4.0",
    "ptyprocess>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "starlette>=0.38",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
helios = "helios.cli:app"

[tool.setuptools.packages.find]
include = ["helios*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"