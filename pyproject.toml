[project]
name = "helios"
version = "0.1.0"
description = "Lightweight watchdog + replay tool for AI coding agents"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "rich>=13.7",
    "watchdog>=4.0",
    "websockets>=12",
    "psutil>=5.9",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[project.scripts]
helios = "cli.main:app"

[tool.setuptools.packages.find]
include = ["core*", "cli*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"